apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nim-fast-start-p4
resources:
  - ../../autoscaler
  - namespace.yaml
  - demand-configmap.yaml
  - smoke-template-configmap.yaml
patches:
  - target:
      kind: ConfigMap
      name: nim-prewarm-settings
    patch: |-
      - op: replace
        path: /data/NODE_SELECTOR
        value: nim-fast-start.nebius.com/pool=p4
      - op: replace
        path: /data/UTILIZATION_THRESHOLD
        value: "0"
      - op: replace
        path: /data/SCALE_DOWN_THRESHOLD
        value: "0"
      - op: replace
        path: /data/POLL_SECONDS
        value: "2"
  - target:
      kind: Deployment
      name: nim-prewarm-controller
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          nim-fast-start.nebius.com/pool: p4
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: nim-fast-start.nebius.com/pool
            operator: Equal
            value: p4
            effect: NoSchedule
  - target:
      kind: ClusterRoleBinding
      name: nim-prewarm-controller-observer
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: nim-fast-start-p4
