apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nim-fast-start
resources:
  - k8s/rbac.yaml
  - k8s/controller.yaml
configMapGenerator:
  - name: nim-prewarm-controller
    files:
      - controller.py
  - name: nim-prewarm-settings
    literals:
      - NODE_SELECTOR=nvidia.com/gpu.present=true
      - UTILIZATION_THRESHOLD=0.8
      - SCALE_DOWN_THRESHOLD=0.5
      - RESERVE_REPLICAS=1
      - GPU_RESOURCE=nvidia.com/gpu
      - TEMPLATE_CONFIGMAP=nim-prewarm-template
      - DEMAND_CONFIGMAP=nim-prewarm-demand
      - POLL_SECONDS=15
      - COLD_FALLBACK=true
generatorOptions:
  disableNameSuffixHash: true
