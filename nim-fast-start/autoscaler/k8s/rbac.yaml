apiVersion: v1
kind: ServiceAccount
metadata:
  name: nim-prewarm-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nim-prewarm-controller-observer
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nim-prewarm-controller-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nim-prewarm-controller-observer
subjects:
  - kind: ServiceAccount
    name: nim-prewarm-controller
    namespace: nim-fast-start
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nim-prewarm-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nim-prewarm-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nim-prewarm-controller
subjects:
  - kind: ServiceAccount
    name: nim-prewarm-controller
