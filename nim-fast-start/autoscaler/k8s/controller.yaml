apiVersion: apps/v1
kind: Deployment
metadata:
  name: nim-prewarm-controller
  labels:
    app.kubernetes.io/name: nim-prewarm-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nim-prewarm-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nim-prewarm-controller
    spec:
      serviceAccountName: nim-prewarm-controller
      containers:
        - name: controller
          image: python:3.12.11-slim-bookworm
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/controller.py"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - configMapRef:
                name: nim-prewarm-settings
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: controller
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: controller
          configMap:
            name: nim-prewarm-controller
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
