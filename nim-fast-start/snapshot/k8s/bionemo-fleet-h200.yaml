# BioNeMo agent NIM fleet — full 8xH200 node deployment.
# Derived from modules/nims/catalog.tf (ARCHVTEAMS-2369): same images, versions,
# commands, shm sizes, and resource shapes, adapted to a single
# 8gpu-128vcpu-1600gb node (node group mk8snodegroup-e00thw7k44pfaq5sqr).
#
# GPU budget (8 physical H200, 141GB each):
#   1 GPU each: openfold2, openfold3, boltz2, evo2-40b, diffdock, rfdiffusion,
#               genmol, molmim  (= 8 via device plugin)
#   shared:     proteinmpnn, msa-search — tiny GPU footprints, run with
#               NVIDIA_VISIBLE_DEVICES=all and no nvidia.com/gpu resource;
#               on 141GB cards the few-GB tenancy is harmless. Documented tradeoff.
# CPU budget: catalog wants 16 CPU/model; node has 128 -> big models get 12,
#   small ones 4-8, sharing tenants 4, to fit 10 models + system pods.
# Caches: one shared 1860Gi NRD volume (subPath per model) — NIM model
#   downloads exceed the 1023Gi boot disk (msa-search DBs alone are huge).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlspec-archvteams-2407-nimcache-m3
  namespace: nim-fast-start
  labels:
    workload: archvteams-2407
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1860Gi
  storageClassName: mlspec-archvteams-2407-io-m3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bnm-openfold2
  namespace: nim-fast-start
  labels: {workload: archvteams-2407, fleet: bionemo, app: bnm-openfold2}
spec:
  replicas: 1
  selector: {matchLabels: {app: bnm-openfold2}}
  template:
    metadata:
      labels: {app: bnm-openfold2, fleet: bionemo, workload: archvteams-2407}
    spec:
      nodeSelector: {nebius.com/node-group-id: mk8snodegroup-e00thw7k44pfaq5sqr}
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      imagePullSecrets: [{name: nvcrio-cred}]
      containers:
      - name: openfold2
        image: nvcr.io/nim/openfold/openfold2:latest
        command: ["/bin/bash", "-c", "/opt/nim/start_server.sh"]
        securityContext: {runAsUser: 0, runAsGroup: 0}
        ports: [{containerPort: 8000, name: http}]
        env:
        - {name: NGC_API_KEY, valueFrom: {secretKeyRef: {name: ngc-api-key, key: NGC_API_KEY}}}
        resources:
          requests: {cpu: "12", memory: "96Gi", nvidia.com/gpu: "1"}
          limits: {cpu: "12", memory: "96Gi", nvidia.com/gpu: "1"}
        volumeMounts:
        - {name: cache, mountPath: /opt/nim/.cache, subPath: openfold2}
        - {name: shm, mountPath: /dev/shm}
        readinessProbe:
          httpGet: {path: /v1/health/ready, port: 8000}
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 200
      volumes:
      - {name: cache, persistentVolumeClaim: {claimName: mlspec-archvteams-2407-nimcache-m3}}
      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
---
