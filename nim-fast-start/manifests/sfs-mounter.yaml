apiVersion: v1
kind: Pod
metadata:
  name: k301ud-sfs-mounter
  namespace: archvteams-2407-k301ud
  labels:
    app.kubernetes.io/name: k301ud-sfs-mounter
    app.kubernetes.io/part-of: archvteams-2407-k301ud
    ml-specialist.nebius.ai/task: k301ud
spec:
  restartPolicy: Always
  nodeSelector:
    ml-specialist.nebius.ai/task: k301ud-sfs
  tolerations:
    - key: ml-specialist.nebius.ai/task
      operator: Equal
      value: k301ud-sfs
      effect: NoSchedule
  containers:
    - name: mounter
      image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
        runAsUser: 0
      command:
        - /bin/sh
        - -c
      args:
        - |
          set -eu
          mkdir -p /host-mnt/k301ud-sfs
          if ! grep -q ' /host-mnt/k301ud-sfs virtiofs ' /proc/mounts; then
            mount -t virtiofs k301ud-sfs /host-mnt/k301ud-sfs
          fi
          mkdir -p \
            /host-mnt/k301ud-sfs/k301ud/checkpoints \
            /host-mnt/k301ud-sfs/k301ud/model-cache
          touch /tmp/ready
          exec sleep 2147483647
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - test -f /tmp/ready && grep -q ' /host-mnt/k301ud-sfs virtiofs ' /proc/mounts
        periodSeconds: 1
        timeoutSeconds: 1
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 1
          memory: 256Mi
      volumeMounts:
        - name: host-mnt
          mountPath: /host-mnt
          mountPropagation: Bidirectional
  volumes:
    - name: host-mnt
      hostPath:
        path: /mnt
        type: Directory
