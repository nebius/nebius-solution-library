---
# Evo2-40B NIM on B300 SXM (1 GPU, 346 GB VRAM — fits 40B params in BF16)
# B300 has sufficient VRAM for Evo2-40B on a single GPU.
# Fall back to 8-GPU B300 node group if this fails with OOM or GPU count error.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evo2-40b
  namespace: nim-fast-start
  labels:
    workload: archvteams-2407
    nim: evo2-40b
    gpu-type: b300
    mode: cold
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evo2-40b
  template:
    metadata:
      labels:
        app: evo2-40b
        workload: archvteams-2407
    spec:
      imagePullSecrets:
        - name: nvcrio-cred
      containers:
        - name: evo2-40b
          image: nvcr.io/nim/arc/evo2-40b:latest
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: "20"
              memory: 200Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "20"
              memory: 200Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            initialDelaySeconds: 3600
            periodSeconds: 60
            failureThreshold: 5
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: nim-cache
              mountPath: /root/.cache/ngc
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: nim-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: evo2-40b-svc
  namespace: nim-fast-start
  labels:
    workload: archvteams-2407
    nim: evo2-40b
spec:
  selector:
    app: evo2-40b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
