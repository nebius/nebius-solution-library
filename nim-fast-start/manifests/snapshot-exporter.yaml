apiVersion: v1
kind: Pod
metadata:
  name: k301ud-snapshot-exporter
  namespace: archvteams-2407-k301ud
  labels:
    app.kubernetes.io/name: k301ud-snapshot-exporter
    app.kubernetes.io/part-of: archvteams-2407-k301ud
    ml-specialist.nebius.ai/task: k301ud
spec:
  restartPolicy: Never
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    ml-specialist.nebius.ai/task: k301ud
  tolerations:
    - key: ml-specialist.nebius.ai/task
      operator: Equal
      value: k301ud
      effect: NoSchedule
  initContainers:
    - name: install-busybox
      image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      command:
        - /bin/sh
        - -c
        - cp /bin/busybox /tools/busybox
      volumeMounts:
        - name: tools
          mountPath: /tools
  containers:
    - name: exporter
      image: cr.eu-north1.nebius.cloud/e00ffw8yqnrrd507t9/archvteams-2407-k301ud/qwen-vllm-placeholder:v1.4.0-public-criu-aio.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
        - exec sleep 2147483647
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 2
          memory: 1Gi
      volumeMounts:
        - name: checkpoints
          mountPath: /source
          readOnly: true
        - name: model-cache
          mountPath: /model-cache
          readOnly: true
        - name: tools
          mountPath: /tools
  volumes:
    - name: checkpoints
      persistentVolumeClaim:
        claimName: snapshot-pvc
    - name: model-cache
      persistentVolumeClaim:
        claimName: model-cache
    - name: tools
      emptyDir: {}
