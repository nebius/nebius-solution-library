---
# Evo2-40B NIM — warm-cache variant (PVC-backed model cache)
# Apply nim-cache-pvc.yaml first to provision the PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evo2-40b
  namespace: nim-fast-start
  labels:
    workload: archvteams-2407
    nim: evo2-40b
    mode: warm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evo2-40b
  template:
    metadata:
      labels:
        app: evo2-40b
        workload: archvteams-2407
    spec:
      imagePullSecrets:
        - name: nvcrio-cred
      containers:
        - name: evo2-40b
          image: nvcr.io/nim/arc/evo2-40b:latest
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: "32"
              memory: 256Gi
              nvidia.com/gpu: "2"
            requests:
              cpu: "32"
              memory: 256Gi
              nvidia.com/gpu: "2"
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: nim-cache
              mountPath: /home/user/.cache/nim
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: nim-cache
          persistentVolumeClaim:
            claimName: evo2-40b-nim-cache
