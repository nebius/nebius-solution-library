---
# OpenFold2 NIM — 1 GPU (H100 or H200), cold-start baseline
# Image: nvcr.io/nim/openfold/openfold2:latest
# Resources: 1 GPU, 16 vCPU, 128 Gi RAM, 64 Gi /dev/shm
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfold2
  namespace: nim-fast-start
  labels:
    workload: archvteams-2407
    nim: openfold2
    mode: cold
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfold2
  template:
    metadata:
      labels:
        app: openfold2
        workload: archvteams-2407
    spec:
      imagePullSecrets:
        - name: nvcrio-cred
      containers:
        - name: openfold2
          image: nvcr.io/nim/openfold/openfold2:latest
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: "15"
              memory: 128Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "15"
              memory: 128Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: nim-cache
              mountPath: /home/user/.cache/nim
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: nim-cache
          # For cold-start tests use emptyDir (no cached weights).
          # For warm-start tests replace with the PVC: nim-cache-pvc.yaml
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openfold2-svc
  namespace: nim-fast-start
  labels:
    workload: archvteams-2407
    nim: openfold2
spec:
  selector:
    app: openfold2
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
