---
# Evo2-40B NIM — 2 GPU (H100 or H200), cold-start baseline
# Image: nvcr.io/nim/arc/evo2-40b:latest
# Resources: 2 GPU, 32 vCPU, 256 Gi RAM, 16 Gi /dev/shm
# Requires a multi-GPU node (8-GPU H100/H200 recommended; pod uses 2 of them)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evo2-40b
  namespace: nim-fast-start
  labels:
    workload: archvteams-2407
    nim: evo2-40b
    mode: cold
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evo2-40b
  template:
    metadata:
      labels:
        app: evo2-40b
        workload: archvteams-2407
    spec:
      imagePullSecrets:
        - name: nvcrio-cred
      containers:
        - name: evo2-40b
          image: nvcr.io/nim/arc/evo2-40b:latest
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: "32"
              memory: 256Gi
              nvidia.com/gpu: "2"
            requests:
              cpu: "32"
              memory: 256Gi
              nvidia.com/gpu: "2"
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: nim-cache
              mountPath: /home/user/.cache/nim
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: nim-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: evo2-40b-svc
  namespace: nim-fast-start
  labels:
    workload: archvteams-2407
    nim: evo2-40b
spec:
  selector:
    app: evo2-40b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
