apiVersion: v1
kind: Pod
metadata:
  name: openfold2-checkpoint-source
  namespace: nim-fast-start
  labels:
    app: openfold2-checkpoint-source
    workload: archvteams-2407
    phase: feasibility
spec:
  restartPolicy: Never
  imagePullSecrets:
    - name: nvcrio-cred
  containers:
    - name: openfold2
      image: nvcr.io/nim/openfold/openfold2@sha256:fc64916731fee39e124225829dca78e80ec24fe1891be47057d0d69209b93ab4
      command:
        - /bin/bash
        - -lc
      args:
        - |
          set -euo pipefail
          bash /opt/nim/start_server.sh &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' TERM INT EXIT

          for _ in $(seq 1 900); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8000/v1/health/ready >/dev/null; then
              echo "SNAPSHOT_SOURCE_GPU_UUID=$(nvidia-smi --query-gpu=uuid --format=csv,noheader | head -1)"
              touch "${DYN_SNAPSHOT_CONTROL_DIR}/ready-for-snapshot"
              wait "$server_pid"
              exit $?
            fi
            sleep 1
          done

          echo "OpenFold2 did not become ready within 900 seconds" >&2
          exit 1
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ngc-api-key
              key: NGC_API_KEY
      ports:
        - name: http
          containerPort: 8000
      resources:
        requests:
          cpu: "15"
          memory: 128Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "15"
          memory: 128Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: nim-cache
          mountPath: /opt/nim/.cache
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
    - name: nim-cache
      persistentVolumeClaim:
        claimName: openfold2-nim-cache
