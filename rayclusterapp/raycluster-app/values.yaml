ray-cluster:
  image:
    repository: rezabah/rayclusterapp-py39-cu128
    tag: "0.1.1"
    pullPolicy: IfNotPresent # By default is IfNotPresent. Always will make it pull the image every time, which is not recommended for production. 
  nameOverride: "rayapp1"
  head:
    # you can find out the Ray version by running this command:
    # docker run --rm rayproject/ray:nightly-py39-cu128 python -c "import ray; print(ray.__version__)"
    rayVersion: 3.0.0.dev0
    image:
      repository: rezabah/rayclusterapp-py39-cu128
      tag: "0.1.1"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "4"          
        memory: "8Gi"    
      limits:
        cpu: "4"          
        memory: "8Gi"  
    rayStartParams:
      dashboard-host: "0.0.0.0"
      metrics-export-port: "9090"

  worker:
    groupName: workergroup
    replicas: 3
    minReplicas: 1
    maxReplicas: 3
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/gpu: 1 
      limits:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/gpu: 1
    image:
      repository: rezabah/rayclusterapp-py39-cu128
      tag: "0.1.1"
      pullPolicy: IfNotPresent
    rayStartParams: {}

driverJob:
  enabled: true
  image: rezabah/rayclusterapp-py39-cu128:0.1.1
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  # The script that will be submitted to the Ray cluster.
  # This script should be present in the container image at /app/<script>.
  # You can change the script name as needed.    
  script: /app/train.py
  # You can set environment variables for your script here. These Env variables will be passed to your script.
  # These Env variables are examples, you can add more as needed or comented them out if not needed.
  env:
    - name: USE_GPU
      value: "true"  
     