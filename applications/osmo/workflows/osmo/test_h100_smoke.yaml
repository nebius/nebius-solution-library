# H100 Smoke Test Workflow
# Verifies that OSMO can schedule onto the configured H100 platform,
# that a GPU is visible inside the task container, and that the GPU
# model reported by nvidia-smi is H100.
#
# Submit with:
#   osmo workflow submit applications/osmo/workflows/osmo/test_h100_smoke.yaml

workflow:
  name: test-h100-smoke
  resources:
    h100-resource:
      platform: H100
      gpu: 1
      cpu: 2
      memory: 4Gi
  tasks:
  - name: check-h100
    image: nvidia/cuda:13.0.2-base-ubuntu24.04
    command: ["bash", "-c"]
    args:
    - |
      set -euo pipefail

      echo "=== H100 Smoke Test ==="
      echo ""
      echo "--- nvidia-smi ---"
      nvidia-smi
      echo ""

      GPU_NAME="$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1 | tr -d '[:space:]')"
      DRIVER_VERSION="$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1 | tr -d '[:space:]')"
      GPU_COUNT="$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d '[:space:]')"

      echo "--- Summary ---"
      echo "GPU name: ${GPU_NAME}"
      echo "Driver:   ${DRIVER_VERSION}"
      echo "Count:    ${GPU_COUNT}"
      echo ""

      if ! echo "${GPU_NAME}" | grep -q "H100"; then
        echo "FAIL: expected an H100 GPU but got '${GPU_NAME}'"
        exit 1
      fi

      if [ "${GPU_COUNT}" -lt 1 ]; then
        echo "FAIL: no GPUs detected"
        exit 1
      fi

      echo "PASS: workflow ran on an H100 GPU"
    resource: h100-resource
