# Accelerator Smoke Test Workflow
# Verifies that OSMO can schedule onto the configured platform
# and that an NVIDIA device is visible inside the task container.
#
# Edit the platform value below before submitting.
# Examples: L40S, H100
#
# Submit with:
#   osmo workflow submit applications/osmo/workflows/osmo/test_gpu_smoke.yaml

workflow:
  name: test-gpu-smoke
  resources:
    accelerator-resource:
      platform: L40S # Set this to the OSMO platform name configured for your cluster.
      gpu: 1
      cpu: 2
      memory: 4Gi
  tasks:
  - name: check-platform
    image: nvidia/cuda:13.0.2-base-ubuntu24.04
    command: ["bash", "-c"]
    args:
    - |
      set -euo pipefail

      echo "=== Accelerator Smoke Test ==="
      echo ""
      echo "--- nvidia-smi ---"
      nvidia-smi
      echo ""

      DEVICE_NAME="$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1 | tr -d '[:space:]')"
      DRIVER_VERSION="$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1 | tr -d '[:space:]')"
      DEVICE_COUNT="$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d '[:space:]')"

      echo "--- Summary ---"
      echo "Device name: ${DEVICE_NAME}"
      echo "Driver:   ${DRIVER_VERSION}"
      echo "Count:    ${DEVICE_COUNT}"
      echo ""

      if [ "${DEVICE_COUNT}" -lt 1 ]; then
        echo "FAIL: no NVIDIA devices detected"
        exit 1
      fi

      echo "PASS: platform scheduled successfully and NVIDIA devices are visible"
    resource: accelerator-resource
